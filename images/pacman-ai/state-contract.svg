<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">PacMan AI: reset should replace the episode state</title>
  <desc id="description">Recorded software-state diagnostic using a three-row, five-column maze with one pellet and one ghost. On main commit 9ec4040, the pellet and ghost counts both increase from one to two to three across two resets. On audited branch 7a1c89b, both counts remain one. This is a source-derived diagram, not a gameplay capture.</desc>
  <!-- Source: public/data/pacman-ai/verification.json, tinyState, observed 2026-09-21. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#9fb4a6"/></marker>
  </defs>
  <rect width="1200" height="750" fill="#070a08"/>
  <rect width="1200" height="8" fill="#4ade80"/>
  <g font-family="ui-monospace, Consolas, monospace">
