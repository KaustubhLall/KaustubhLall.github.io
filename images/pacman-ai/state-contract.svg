      <text x="91" y="362">#P.G#</text>
      <text x="91" y="412">#####</text>
    </g>
    <text x="78" y="464" fill="#e9f2ec" font-size="20">P = Pac-Man</text>
    <text x="78" y="497" fill="#e9f2ec" font-size="20">. = pellet</text>
    <text x="78" y="530" fill="#e9f2ec" font-size="20">G = ghost</text>

    <text x="374" y="238" fill="#fbbf24" font-size="21" font-weight="700">MAIN / 9ec4040</text>
    <text x="374" y="268" fill="#9fb4a6" font-size="18">Pellets and ghosts accumulate</text>
    <text x="374" y="437" fill="#4ade80" font-size="21" font-weight="700">AUDITED BRANCH / 7a1c89b</text>
    <text x="374" y="467" fill="#9fb4a6" font-size="18">Pellets and ghosts are replaced</text>

