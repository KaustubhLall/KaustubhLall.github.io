    <text x="54" y="124" fill="#e9f2ec" font-size="39" font-weight="700">Reset should replace the episode.</text>
    <text x="54" y="164" fill="#9fb4a6" font-size="21">The same tiny maze, two resets, no movement</text>

    <rect x="54" y="210" width="270" height="351" rx="12" fill="#0c120e" stroke="#2f4636" stroke-width="2"/>
    <text x="78" y="251" fill="#9fb4a6" font-size="17" letter-spacing="2">3 × 5 FIXTURE</text>
