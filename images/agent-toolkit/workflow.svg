<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">Agent Toolkit: reviewed export and owned installation</title>
  <desc id="description">Source-derived diagram with two lanes. Publisher with review required for a new export: enrolled sources, sanitized diff and review fingerprint, exact reviewed export. Pending-commit retries follow separate checks. Consumer: verified manifest, planned owned writes, installed skills and local receipt. Private configuration stays local. This describes the source contract at commit 06c24b3, not a captured execution.</desc>
